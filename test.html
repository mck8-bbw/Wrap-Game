<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Button Test</title>
<style>body{font-family:sans-serif;padding:2rem;background:#111;color:#eee;}.screen{display:none;}.screen.active{display:block;}button{padding:10px 20px;margin:5px;font-size:16px;}</style>
</head>
<body>
<div id="s-home" class="screen active">
  <h1>Home Screen</h1>
  <button id="btn-go">Go to Setup</button>
</div>
<div id="s-setup" class="screen">
  <h1>Setup Screen ✅</h1>
  <p>If you see this, buttons work!</p>
  <button id="btn-back">Back</button>
</div>
<script type="module">
  function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
  document.getElementById('btn-go').onclick=()=>show('s-setup');
  document.getElementById('btn-back').onclick=()=>show('s-home');
  document.body.insertAdjacentHTML('beforeend','<p style="color:lime;margin-top:1rem">✅ Script loaded OK</p>');
</script>
</body>
</html>
